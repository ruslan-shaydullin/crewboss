name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run reference test suites
        run: |
          set -euo pipefail
          fail=0
          for t in reference/tests/*.test.sh; do
            echo "=== $t"
            bash "$t" || fail=1
          done
          exit "$fail"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - name: smoke (page load + all tabs + 0 console errors)
        run: node scripts/smoke.mjs
      - name: repro-jitter (no spurious FLIP translate on idle ticks)
        run: node scripts/repro-jitter.mjs
