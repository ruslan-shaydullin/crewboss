name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  freshness:
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'charter/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check branch is not stale behind main
        run: bash reference/bin/check-freshness.sh
        env:
          FRESHNESS_THRESHOLD: '0'

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: runtime-manifest determinism sanity (#710)
        run: bash reference/tests/runtime-manifest-determinism.test.sh
      - name: run reference test suites
        run: |
          set -euo pipefail
          fail=0
          for t in reference/tests/*.test.sh; do
            echo "=== $t"
            bash "$t" || fail=1
          done
          exit "$fail"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run build
      - name: smoke (page load + all tabs + 0 console errors)
        run: node scripts/smoke.mjs
      - name: repro-jitter (no spurious FLIP translate on idle ticks)
        run: node scripts/repro-jitter.mjs
      - name: layout overlap (queue and agents rail do not overlap with 30+ items)
        working-directory: ui/app
        run: node scripts/layout-overlap.mjs
      - name: facilitator stage (discuss step + acceptance block gate)
        run: node scripts/test-facilitator-stage.mjs
      - name: Detect UI-touching PR
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git diff --name-only origin/$GITHUB_BASE_REF -- ui/ | grep -q . && echo "UI_CHANGED=true" >> $GITHUB_ENV || true
      - name: Synthetic visual regression acceptance test
        if: github.event_name == 'pull_request' && env.UI_CHANGED == 'true'
        run: |
          # Mutate dist/ CSS to hide the board panel
          # dist/ is gitignored — use cp/mv, not git checkout -- dist/ (which cannot restore gitignored files)
          BROKEN_CSS=$(find dist -name '*.css' | head -1)
          cp "$BROKEN_CSS" "${BROKEN_CSS}.bak"
          echo ".charter{display:none!important}" >> "$BROKEN_CSS"
          # Assert visual-regression.mjs exits 1 (regression detected)
          # Use 'if node ...; then exit 1; fi' — NOT '|| true' which swallows failures
          if node scripts/visual-regression.mjs; then
            echo "ERROR: Expected exit 1 from visual-regression.mjs on broken panel — regression not detected"
            mv "${BROKEN_CSS}.bak" "$BROKEN_CSS"
            exit 1
          fi
          # Restore
          mv "${BROKEN_CSS}.bak" "$BROKEN_CSS"
      - name: Visual regression
        if: github.event_name == 'pull_request' && env.UI_CHANGED == 'true'
        run: node scripts/visual-regression.mjs
      - name: Post visual-regression commit status
        if: always() && github.event_name == 'pull_request' && env.UI_CHANGED == 'true'
        run: |
          STATE=success
          [ "${{ job.status }}" != "success" ] && STATE=failure
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state=$STATE \
            -f context=visual-regression \
            -f description="Visual regression check"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
