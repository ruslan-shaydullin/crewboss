name: Feature request
description: Propose a concrete improvement to crewboss.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who encounters the problem and a concrete example of the current workflow.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the result you want and how someone could verify that it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include existing workarounds and effects on permissions, runtime cost, or compatibility if relevant.
