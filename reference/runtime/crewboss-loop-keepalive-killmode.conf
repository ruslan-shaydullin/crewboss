# crewboss-loop-keepalive-killmode.conf — charter #1144.
#
# systemd drop-in for crewboss-loop-keepalive.service. Installs to:
#   /etc/systemd/system/crewboss-loop-keepalive.service.d/10-killmode.conf
#
# Interim fix applied during the 2026-06-30→07-01 outage: the Type=oneshot keepalive
# service spawned the launcher via `nohup … &`; without KillMode=process systemd tore down
# the service cgroup on ExecStart exit and killed the just-spawned launcher (infinite
# restart-kill every 5 min). KillMode=process makes systemd kill ONLY the main process on
# stop, leaving the forked launcher alive.
#
# With the charter #1144 design (launcher runs as its own crewboss-launcher.service) the
# nohup fork is gone on properly-migrated boxes, so this drop-in is belt-and-braces for the
# legacy fallback path.

[Service]
KillMode=process
