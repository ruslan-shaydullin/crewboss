# Preserve the service account's inherited hard limits without changing units.
# nsjail 3.6 CLI "--rlimit_as max" / "--rlimit_fsize max" stores a byte value
# as VALUE and then multiplies it by MiB; RLIM_INFINITY therefore overflows.
# Typed HARD resolves the inherited value without that multiplication.
rlimit_as_type: HARD
rlimit_fsize_type: HARD
